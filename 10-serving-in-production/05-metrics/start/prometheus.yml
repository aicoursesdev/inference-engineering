# Same shape as vLLM's prometheus.yaml (docs.vllm.ai, observability/prometheus_grafana), pointed at llama-server.
global:
  scrape_interval: 5s
  evaluation_interval: 30s
scrape_configs:
  - job_name: llama-server
    static_configs:
      - targets: ['host.docker.internal:8081']   # llama-server started with --metrics
