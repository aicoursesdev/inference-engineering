# KServe v0.21 "Deploy your first LLM" (kserve.github.io/website/docs/getting-started/genai-first-isvc, read 2026-11-12),
# with the GPU lines removed for a CPU-only kind cluster. The page documents the GPU version; the CPU edit is ours
# and has not been run on a cluster here. A CPU run of the Hugging Face runtime is shown in a KServe 0.15 post
# (rafvasq.github.io, 2025-06-05), which sets VLLM_CPU_KVCACHE_SPACE and a 4 CPU / 4Gi request.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-llm
  namespace: kserve-test
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 2
    model:
      modelFormat:
        name: huggingface
      args:
        - --model_name=qwen
      storageUri: "hf://Qwen/Qwen2.5-0.5B-Instruct"
      env:
        - {name: VLLM_CPU_KVCACHE_SPACE, value: "1"}   # as in the 2025 CPU walkthrough (value in GiB)
      resources:
        requests: {cpu: "2", memory: 6Gi}
        limits: {cpu: "4", memory: 8Gi}
