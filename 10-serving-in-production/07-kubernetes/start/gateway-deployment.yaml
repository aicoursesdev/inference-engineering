# The same gateway as a plain Kubernetes Deployment, Service and HorizontalPodAutoscaler (autoscaling/v2).
# Written from the Kubernetes docs; not run on a cluster here. Scaling on CPU is shown because it works out of
# the box; scaling the ENGINE on queue depth needs a custom or external metrics adapter (lesson 10.6).
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: monsoon/gateway:0.1          # built from the Dockerfile in lesson 10.2
          ports: [{containerPort: 8090}]
          env:
            - {name: UPSTREAMS, value: "http://qwen-llm-predictor.kserve-test"}
          readinessProbe: {httpGet: {path: /stats, port: 8090}}
          resources: {requests: {cpu: 250m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  selector: {app: gateway}
  ports: [{port: 80, targetPort: 8090}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gateway}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
